name: tlh CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

env:
  PRIMARY_NODE_VERSION: "22.23.4"
  PNPM_VERSION: "9.15.0"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.ref == 'refs/heads/main' && github.sha || 'latest' }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  checks:
    name: Checks (ubuntu-latest, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    permissions:
      contents: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check source files for literal NUL bytes
        run: node scripts/check-source-nul.mjs

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore React Compiler cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: checks
          turbo-cache: "true"

      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
        run: bash .github/actions/setup-workspace/install-dependencies.sh

      - name: Build, typecheck, and lint
        run: pnpm exec turbo run build typecheck lint --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only --summarize --concurrency=4

      - name: Check app bundle budgets
        run: node apps/app/scripts/check-bundle-budget.mjs

      - name: Check provider-literal ratchet
        run: |
          git fetch --depth=1 origin "${{ github.base_ref || github.event.repository.default_branch }}" || true
          node scripts/check-provider-literal-ratchet.mjs --base "origin/${{ github.base_ref || github.event.repository.default_branch }}"

      - name: Check Actions cache usage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/check-actions-cache-usage.mjs

      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 1024

  tests:
    name: Tests (${{ matrix.shard }}, ubuntu-latest, Node 22.x)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: server-1
            filter: --filter=@bb/server
            vitestShard: "1/2"
          - shard: server-2
            filter: --filter=@bb/server
            vitestShard: "2/2"
          - shard: app-1
            filter: --filter=@bb/app
            vitestShard: "1/8"
          - shard: app-2
            filter: --filter=@bb/app
            vitestShard: "2/8"
          - shard: app-3
            filter: --filter=@bb/app
            vitestShard: "3/8"
          - shard: app-4
            filter: --filter=@bb/app
            vitestShard: "4/8"
          - shard: app-5
            filter: --filter=@bb/app
            vitestShard: "5/8"
          - shard: app-6
            filter: --filter=@bb/app
            vitestShard: "6/8"
          - shard: app-7
            filter: --filter=@bb/app
            vitestShard: "7/8"
          - shard: app-8
            filter: --filter=@bb/app
            vitestShard: "8/8"
          - shard: integration
            filter: --filter=@bb/integration-tests
            vitestShard: ""
          - shard: plugins
            filter: --filter='bb-plugin-*'
            vitestShard: ""
          - shard: packages-host
            filter: --filter=@bb/host-daemon --filter=@bb/cli --filter=@bb/agent-runtime --filter=@bb/provider-parity --filter=@bb/db
            vitestShard: ""
          - shard: packages-build
            filter: --filter=@bb/templates --filter=bb-app --filter=@bb/demo-server --filter=@bb/desktop --filter=@bb/plugin-build
            vitestShard: ""
          - shard: packages-other
            filter: --filter='!@bb/server' --filter='!@bb/app' --filter='!@bb/integration-tests' --filter='!bb-plugin-*' --filter='!@bb/host-daemon' --filter='!@bb/cli' --filter='!@bb/agent-runtime' --filter='!@bb/provider-parity' --filter='!@bb/db' --filter='!@bb/templates' --filter='!bb-app' --filter='!@bb/demo-server' --filter='!@bb/desktop' --filter='!@bb/plugin-build'
            vitestShard: ""
            mobile: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup workspace tools
        uses: ./.github/actions/setup-workspace-tools
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          pnpm-version: ${{ env.PNPM_VERSION }}

      - name: Restore React Compiler cache
        if: ${{ contains(matrix.filter, '--filter=@bb/demo-server') }}
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-react-compiler

      - name: Restore workspace caches
        id: cache
        timeout-minutes: 1
        continue-on-error: true
        uses: ./.github/actions/cache-workspace
        with:
          node-version: ${{ env.PRIMARY_NODE_VERSION }}
          cache-prefix: test-${{ matrix.shard }}
          turbo-cache: "true"

      - name: Install dependencies
        timeout-minutes: 5
        env:
          TURBO_CACHE_RESTORE_OUTCOME: ${{ steps.cache.outcome }}
          APP_SHARD: ${{ startsWith(matrix.shard, 'app-') }}
          MOBILE_TESTS: ${{ matrix.mobile }}
        run: |
          filters=()
          if [[ "$APP_SHARD" == "true" ]]; then
            filters=(--ignore-scripts --filter bb --filter '@bb/app...' --filter '@bb/db...')
          elif [[ "$MOBILE_TESTS" != "true" ]]; then
            filters=(--filter '!@bb/mobile')
          fi
          bash .github/actions/setup-workspace/install-dependencies.sh "${filters[@]}"

      - name: Setup Bun
        if: ${{ startsWith(matrix.shard, 'packages-') || matrix.shard == 'plugins' }}
        timeout-minutes: 4
        uses: ./.github/actions/setup-bun
        with:
          version: "1.3.14"

      - name: Install Electron runtime libraries
        if: ${{ matrix.shard == 'packages-build' }}
        run: |
          bash .github/actions/setup-workspace/install-electron-libraries.sh
          ELECTRON_RUN_AS_NODE=1 pnpm --filter @bb/desktop exec electron --version

      - name: Test
        env:
          BB_CI_TEST_SHARD: ${{ matrix.vitestShard }}
          VITEST_MAX_WORKERS: "2"
        run: ${{ matrix.shard == 'packages-build' && 'xvfb-run -a' || '' }} pnpm exec turbo run test ${{ matrix.filter }} --cache-dir="${TURBO_CACHE_DIR:-.turbo/cache}" --output-logs=new-only --summarize --concurrency=4

      - name: Test native browser address interactions
        if: ${{ contains(matrix.filter, '--filter=@bb/desktop') }}
        run: xvfb-run -a pnpm exec turbo run smoke:browser-address --filter=@bb/desktop --output-logs=new-only

      - name: Upload test timings
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 1
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: test-timings-${{ matrix.shard }}-${{ github.run_attempt }}
          path: .turbo/runs/*.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: ignore

      - name: Bound saved Turbo cache
        run: node scripts/prune-turbo-cache.mjs --dir .turbo/cache --max-size-mb 1024
